name: Docker image

on:
  push:
    branches: [master]
    paths:
      - docker/sub2api-skill/**
      - skills/sub2api/templates/bot_core.py
      - skills/sub2api/templates/telegram-bot.py
      - skills/sub2api/templates/qq-bot.py
      - .github/workflows/docker-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/sub2api-skill/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/sub2api-skill:latest
            ghcr.io/${{ github.repository_owner }}/sub2api-skill:${{ github.sha }}
