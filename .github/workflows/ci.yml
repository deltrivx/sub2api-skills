name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Validate templates and skill files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Python syntax check
        run: |
          python -m py_compile \
            skills/sub2api/templates/telegram-bot.py

      - name: Node syntax check
        run: |
          shopt -s nullglob
          for file in skills/sub2api/scripts/*.js; do
            node --check "$file"
          done

      - name: JSON validation
        run: |
          python -m json.tool skill.json >/dev/null
          python -m json.tool .claude-plugin/marketplace.json >/dev/null

      - name: Sensitive information guard
        run: |
          python - <<'PY'
          import pathlib, re, sys
          root = pathlib.Path('.')
          files = [p for p in root.rglob('*') if p.is_file() and '.git' not in p.parts]
          text = '\n'.join(p.read_text(errors='ignore') for p in files)
          checks = {
              'private IPv4 address': r'(?<![\d.])(?:10\.\d{1,3}|172\.(?:1[6-9]|2\d|3[01])|192\.168)\.\d{1,3}\.\d{1,3}(?![\d.])',
              'telegram bot token': r'\b\d{8,12}:[A-Za-z0-9_-]{30,}\b',
              'OpenAI-style secret key': r'\bsk-[A-Za-z0-9_-]{20,}\b',
              'JWT': r'eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}',
          }
          failed = []
          for name, pattern in checks.items():
              if re.search(pattern, text):
                  failed.append(name)
          if failed:
              print('Potential sensitive data detected:', ', '.join(failed))
              sys.exit(1)
          print('Sensitive information guard passed')
          PY
