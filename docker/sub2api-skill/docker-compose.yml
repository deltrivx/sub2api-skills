# Sub2API Skill 容器编排
#
# 通过 `.env` 中的 SUB2API_BOT_BACKEND 选择后端：
#   SUB2API_BOT_BACKEND=telegram   → 启动 Telegram Bot
#   SUB2API_BOT_BACKEND=qq         → 启动 QQ Bot（QQ 开放平台 v2）
#
# 后端凭据也在 .env 中配置（TELEGRAM_BOT_TOKEN 或 QQ_APP_ID/QQ_APP_SECRET）。
services:
  sub2api-skill:
    image: ghcr.io/deltrivx/sub2api-skill:latest
    container_name: sub2api-skill
    restart: always
    network_mode: host
    env_file:
      - ./.env
    volumes:
      - ./config:/config
      - ./data:/data
      - /vol2/1000/Docker/sub2api/data:/sub2api-data:ro
      - /vol2/1000/Docker/sub2api:/sub2api-compose:ro
      - /var/run/docker.sock:/var/run/docker.sock
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '3'
